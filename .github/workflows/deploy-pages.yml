name: Deploy to GitHub Pages

on:
  push:
    branches: [clusterBasedGA]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # react-scripts 4 does not run on Node 17+ (OpenSSL / postcss errors).
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI=false so existing lint warnings do not fail the build.
      - name: Build
        run: npm run build
        env:
          CI: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
